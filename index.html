<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisiAura Pro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root { --aura-red: #E60023; --aura-dark: #111111; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #ffffff; color: var(--aura-dark); overflow-x: hidden; }

        .masonry { 
            column-count: 2; 
            column-gap: 12px; 
            width: 100%;
        }
        @media (min-width: 768px) { .masonry { column-count: 3; column-gap: 16px; } }
        @media (min-width: 1024px) { .masonry { column-count: 5; } }

        .pin-card { 
            break-inside: avoid; 
            margin-bottom: 12px; 
            border-radius: 20px; 
            overflow: hidden; 
            position: relative; 
            transition: transform 0.3s ease; 
            cursor: zoom-in; 
            background: #fdfdfd;
            border: 1px solid #f0f0f0;
        }
        .pin-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .pin-card img { width: 100%; display: block; height: auto; transition: opacity 0.3s ease; }

        #acc-drawer { transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1); }
        #acc-drawer.open { transform: translateY(0); }

        ::-webkit-scrollbar { width: 0px; }
        .tab-content { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-white">

<div id="app-root">
    <div id="loader" class="fixed inset-0 bg-white z-[9999] hidden flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-gray-100 border-t-[#E60023] rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-xs tracking-widest text-gray-400">MEMPROSES...</p>
    </div>

    <section id="auth-section" class="fixed inset-0 bg-white z-[5000] flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center">
            <div class="w-20 h-20 bg-[#E60023] rounded-[30%] mx-auto mb-6 flex items-center justify-center text-white shadow-xl rotate-6">
                <i data-lucide="sparkles" class="w-10 h-10"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tighter mb-2">VisiAura<span class="text-[#E60023]">.</span></h1>
            <p class="text-gray-400 font-medium mb-10 text-sm">Masuk untuk melihat dunia visual impianmu.</p>
            <div class="space-y-3">
                <button onclick="login('google')" class="w-full py-4 rounded-2xl border border-gray-100 font-bold flex items-center justify-center gap-4 hover:bg-gray-50 transition-all text-sm">
                    <img src="https://ik.imagekit.io/Kenzo/IMG_20251226_162306.jpg?updatedAt=1766741300056" class="w-5 h-5"> Google
                </button>
                <button onclick="login('guest')" class="w-full bg-black text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-transform text-sm">
                    Guest Mode
                </button>
            </div>
        </div>
    </section>

    <section id="main-section" class="hidden min-h-screen bg-white">
        <header class="fixed top-0 inset-x-0 bg-white/80 backdrop-blur-xl z-[200] px-4 md:px-8 py-4 flex items-center gap-4 border-b border-gray-50">
            <div class="text-[#E60023] font-black text-2xl hidden md:block">V</div>
            
            <div class="flex-1 relative">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                <input type="text" placeholder="Cari aura estetika..." class="w-full bg-gray-100 focus:bg-white focus:ring-4 focus:ring-red-50 rounded-full py-3 pl-12 pr-12 border-none transition-all text-sm">
                <button onclick="visualSearch()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#E60023]">
                    <i data-lucide="camera" class="w-4 h-4"></i>
                </button>
            </div>

            <button onclick="openCreator()" class="w-11 h-11 bg-black text-white rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
            
            <button onclick="toggleAccount()" class="w-11 h-11 rounded-xl bg-gray-100 overflow-hidden border border-gray-100">
                <img id="u-pfp" src="" class="w-full h-full object-cover">
            </button>
        </header>

        <main class="pt-24 pb-32 px-4 md:px-8 max-w-[1500px] mx-auto">
            <div id="view-home" class="tab-content masonry"></div>

            <div id="view-neo" class="tab-content hidden max-w-xl mx-auto py-8">
                <div class="bg-white p-8 rounded-[40px] shadow-2xl border border-gray-50">
                    <h2 class="text-3xl font-black mb-2 tracking-tighter">Neo <span class="text-red-600">AI</span></h2>
                    <p class="text-xs text-gray-400 mb-6 uppercase tracking-widest font-bold">Gemini 2.5 Flash Engine</p>
                    <textarea id="neo-prompt" rows="4" class="w-full bg-gray-50 rounded-3xl p-6 border-none text-sm" placeholder="Apa video cinematic impianmu?"></textarea>
                    <button onclick="runGemini('neo')" class="w-full mt-4 bg-[#E60023] text-white py-4 rounded-2xl font-black shadow-lg flex items-center justify-center gap-3">
                        <i data-lucide="zap" class="w-4 h-4"></i> PROSES VISUAL
                    </button>
                </div>
                <div id="neo-res" class="mt-6 hidden p-8 bg-black text-white rounded-[30px] text-sm italic leading-relaxed shadow-xl"></div>
            </div>

            <div id="view-ootd" class="tab-content hidden max-w-xl mx-auto py-8">
                <div class="bg-white p-8 rounded-[40px] shadow-2xl border border-gray-50">
                    <h2 class="text-3xl font-black mb-6 tracking-tighter">OOTD Trend</h2>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <select id="ootd-gen" class="p-4 bg-gray-50 rounded-xl border-none text-sm font-bold">
                            <option>Wanita</option><option>Pria</option>
                        </select>
                        <select id="ootd-style" class="p-4 bg-gray-50 rounded-xl border-none text-sm font-bold">
                            <option>Streetwear</option><option>Minimalist</option><option>Vintage</option><option>Old Money</option>
                        </select>
                    </div>
                    <button onclick="runGemini('ootd')" class="w-full bg-black text-white py-4 rounded-2xl font-black flex items-center justify-center gap-3">
                        <i data-lucide="sparkles" class="w-4 h-4"></i> DAPATKAN IDE
                    </button>
                </div>
                <div id="ootd-res" class="mt-6 hidden p-8 bg-white border border-gray-100 rounded-[30px] shadow-lg text-sm leading-relaxed"></div>
            </div>

            <div id="view-chat" class="tab-content hidden max-w-2xl mx-auto h-[60vh] flex flex-col bg-white rounded-[40px] shadow-2xl overflow-hidden border">
                <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50/20"></div>
                <div class="p-4 bg-white border-t flex gap-3">
                    <input id="msg-in" type="text" placeholder="Ketik pesan..." class="flex-1 bg-gray-100 rounded-xl px-4 py-3 border-none text-sm">
                    <button onclick="sendMsg()" class="bg-[#E60023] text-white p-3 rounded-xl"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-xl border border-gray-100 shadow-2xl rounded-full px-8 py-4 flex items-center gap-10 z-[200]">
            <button onclick="changeTab('home')" id="btn-h" class="text-[#E60023] transition-all"><i data-lucide="home" class="w-6 h-6"></i></button>
            <button onclick="changeTab('neo')" id="btn-n" class="text-gray-400 hover:text-black transition-all"><i data-lucide="video" class="w-6 h-6"></i></button>
            <button onclick="changeTab('ootd')" id="btn-o" class="text-gray-400 hover:text-black transition-all"><i data-lucide="shirt" class="w-6 h-6"></i></button>
            <button onclick="changeTab('chat')" id="btn-c" class="text-gray-400 hover:text-black transition-all"><i data-lucide="message-square" class="w-6 h-6"></i></button>
        </nav>
    </section>

    <div id="acc-overlay" onclick="toggleAccount()" class="fixed inset-0 bg-black/40 z-[1000] hidden backdrop-blur-sm"></div>
    <div id="acc-drawer" class="fixed bottom-0 left-0 right-0 bg-white z-[1001] rounded-t-[50px] p-8 shadow-2xl max-h-[85vh] overflow-y-auto">
        <div class="w-12 h-1.5 bg-gray-100 rounded-full mx-auto mb-8"></div>
        <div class="flex items-center gap-6 mb-8">
            <img id="d-pfp" src="" class="w-20 h-20 rounded-[35%] border-2 border-gray-50 shadow-md">
            <div>
                <h3 id="d-name" class="text-2xl font-black tracking-tighter">User Aura</h3>
                <p id="d-mail" class="text-gray-400 text-xs"></p>
                <span class="inline-block mt-2 bg-red-50 text-[#E60023] text-[9px] px-2 py-0.5 rounded-full font-black">VisiAura Pro Member</span>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-6 bg-gray-50 rounded-[30px] space-y-4">
                <h4 class="font-black text-xs uppercase text-gray-400">Pengaturan</h4>
                <div class="flex items-center justify-between p-3 bg-white rounded-xl shadow-sm">
                    <span class="text-sm font-bold flex items-center gap-3"><i data-lucide="palette" class="w-4 h-4"></i> Dark Mode</span>
                    <input type="checkbox" class="accent-[#E60023]">
                </div>
                <div class="flex items-center justify-between p-3 bg-white rounded-xl shadow-sm">
                    <span class="text-sm font-bold flex items-center gap-3"><i data-lucide="bell" class="w-4 h-4"></i> Notifikasi</span>
                    <input type="checkbox" checked class="accent-[#E60023]">
                </div>
            </div>
            <div class="p-6 bg-gray-50 rounded-[30px] space-y-4">
                <h4 class="font-black text-xs uppercase text-gray-400">Kelola Akun</h4>
                <div id="account-list" class="space-y-2"></div>
                <button onclick="login('google')" class="w-full py-3 border-2 border-dashed border-gray-200 rounded-xl text-gray-400 text-xs font-bold hover:border-black transition-all">+ Akun</button>
                <button onclick="logout()" class="w-full mt-4 py-3 bg-red-100 text-[#E60023] rounded-xl font-black text-xs flex items-center justify-center gap-2">KELUAR</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCClWupRb5ETPWm-tQ_-x4U9K0dZ5CjPKQ",
        authDomain: "visiaura-87251.firebaseapp.com",
        projectId: "visiaura-87251",
        storageBucket: "visiaura-87251.firebasestorage.app",
        messagingSenderId: "999783403118",
        appId: "1:999783403118:web:436dd872d599e7f5eaa07f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    const appId = "visiaura-87251";
    const geminiKey = ""; 

    let currentUser = null;

    window.login = (type) => type === 'google' ? signInWithPopup(auth, provider) : signInAnonymously(auth);
    window.logout = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async (u) => {
        if (u) {
            currentUser = u;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            setupUI();
            saveAccount(u);
        }
    });

    const setupUI = () => {
        const pfp = currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.displayName || 'G'}&background=E60023&color=fff`;
        document.getElementById('u-pfp').src = pfp;
        document.getElementById('d-pfp').src = pfp;
        document.getElementById('d-name').innerText = currentUser.displayName || "Explorer Aura";
        document.getElementById('d-mail').innerText = currentUser.email || "Guest User";
        
        renderInitialMasonry();
        setupChatSync();
        lucide.createIcons();
    };

    const renderInitialMasonry = () => {
        const container = document.getElementById('view-home');
        let html = "";
        for(let i=0; i<75; i++) {
            const h = 250 + Math.floor(Math.random() * 350);
            html += `
                <div class="pin-card group">
                    <img src="https://picsum.photos/seed/${i+500}/500/${h}" loading="lazy" alt="Visual Aura">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-all p-3 flex flex-col justify-end">
                        <button class="bg-[#E60023] text-white py-2 rounded-full font-bold text-[10px] mb-1">Simpan</button>
                    </div>
                </div>`;
        }
        container.innerHTML = html;
    };

    window.runGemini = async (type) => {
        const loader = document.getElementById('loader');
        const resBox = document.getElementById(type === 'neo' ? 'neo-res' : 'ootd-res');
        const promptInput = type === 'neo' ? document.getElementById('neo-prompt').value : `Saran OOTD ${document.getElementById('ootd-gen').value} gaya ${document.getElementById('ootd-style').value}`;

        if(!promptInput) return;
        loader.classList.remove('hidden');

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: promptInput + " (Balas dalam Bahasa Indonesia)" }] }] })
            });
            const d = await r.json();
            resBox.innerText = d.candidates[0].content.parts[0].text;
            resBox.classList.remove('hidden');
        } catch (e) { alert("AI Lagi sibuk, coba lagi Ya."); }
        finally { loader.classList.add('hidden'); }
    };

    const setupChatSync = () => {
        const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), orderBy('time', 'asc'));
        onSnapshot(q, (snap) => {
            const box = document.getElementById('chat-box');
            box.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                const isMe = m.uid === currentUser.uid;
                box.innerHTML += `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'} animate-fadeIn">
                        <div class="max-w-[85%] p-4 rounded-2xl ${isMe ? 'bg-[#E60023] text-white' : 'bg-white border'} text-xs font-medium">
                            <p class="text-[8px] opacity-60 mb-1 font-black">${m.name}</p>
                            ${m.text}
                        </div>
                    </div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    window.sendMsg = async () => {
        const input = document.getElementById('msg-in');
        if(!input.value.trim()) return;
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
            text: input.value, uid: currentUser.uid, name: currentUser.displayName || "Guest", time: serverTimestamp()
        });
        input.value = "";
    };

    window.changeTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.getElementById(`view-${id}`).classList.remove('hidden');
        ['h','n','o','c'].forEach(k => document.getElementById(`btn-${k}`).classList.replace('text-[#E60023]', 'text-gray-400'));
        document.getElementById(`btn-${id.charAt(0)}`).classList.replace('text-gray-400', 'text-[#E60023]');
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.toggleAccount = () => {
        document.getElementById('acc-drawer').classList.toggle('open');
        document.getElementById('acc-overlay').classList.toggle('hidden');
    };

    const saveAccount = (u) => {
        let vault = JSON.parse(localStorage.getItem('va_v2_vault') || '[]');
        if(!vault.find(a => a.uid === u.uid)) {
            vault.push({ uid: u.uid, name: u.displayName || 'Guest', pfp: u.photoURL });
            localStorage.setItem('va_v2_vault', JSON.stringify(vault));
        }
        renderAccountVault(vault);
    };

    const renderAccountVault = (list) => {
        const div = document.getElementById('account-list');
        div.innerHTML = list.map(a => `
            <div class="flex items-center justify-between p-3 bg-white rounded-xl border ${a.uid === currentUser.uid ? 'border-[#E60023]' : 'border-gray-50'}">
                <div class="flex items-center gap-3">
                    <img src="${a.pfp || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full">
                    <p class="text-[10px] font-bold">${a.name}</p>
                </div>
                ${a.uid === currentUser.uid ? '<span class="text-[8px] font-black text-[#E60023]">AKTIF</span>' : ''}
            </div>
        `).join('');
    };

    window.visualSearch = () => alert("Membuka Kamera untuk Pencarian Visual...");
    window.openCreator = () => alert("Gunakan tombol ini untuk menambahkan foto Anda ke Galeri VisiAura.");

    lucide.createIcons();
</script>
</body>
</html>
