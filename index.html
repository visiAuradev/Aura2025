<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisiAura | Creative Visual Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --pinter-red: #E60023;
            --pinter-dark: #111111;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: var(--pinter-dark);
            overflow-x: hidden;
        }

        .glass-ui {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .masonry-grid {
            column-count: 2;
            column-gap: 16px;
        }
        @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 5; } }

        .pin-item {
            break-inside: avoid;
            margin-bottom: 16px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            background: #f1f1f1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pin-item:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

        .floating-card {
            position: absolute;
            animation: floatUp 12s linear infinite;
            opacity: 0;
            z-index: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) rotate(20deg); opacity: 0; }
        }

        #account-drawer {
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #account-drawer.active { transform: translateY(0); }

        .tab-v { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #E60023; border-radius: 10px; }
    </style>
</head>
<body class="bg-white">

    <div id="app">
        <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[3000] w-full max-w-xs space-y-2"></div>

        <section id="auth-section" class="min-h-screen relative flex items-center justify-center overflow-hidden bg-white">
            <div id="bg-visuals" class="absolute inset-0"></div>
            
            <div class="relative z-10 glass-ui p-10 rounded-[50px] shadow-2xl w-[90%] max-w-md text-center border-white/50 border">
                <div class="w-20 h-20 bg-[#E60023] rounded-3xl flex items-center justify-center text-white mx-auto mb-8 shadow-xl rotate-3">
                    <i data-lucide="sparkles" class="w-10 h-10"></i>
                </div>
                <h1 class="text-4xl font-extrabold tracking-tighter mb-2">VisiAura</h1>
                <p class="text-gray-400 font-medium mb-10">Temukan inspirasi visual harianmu</p>
                
                <div class="space-y-4">
                    <button onclick="loginGoogle()" class="w-full py-4 rounded-2xl border border-gray-100 font-bold text-sm flex items-center justify-center gap-3 hover:bg-gray-50 transition-all active:scale-95">
                        <img src="https://ik.imagekit.io/Kenzo/IMG_20251226_162306.jpg?updatedAt=1766741300056" class="w-5 h-5">
                        Masuk dengan Google
                    </button>
                    <button onclick="loginGuest()" class="w-full bg-black text-white py-4 rounded-2xl font-bold text-sm shadow-xl active:scale-95 transition-all">
                        Masuk sebagai Guest
                    </button>
                </div>
            </div>
        </section>

        <section id="main-section" class="hidden min-h-screen">
            <header class="fixed top-0 w-full bg-white/80 backdrop-blur-xl z-[100] px-6 py-4 flex items-center justify-between border-b border-gray-50">
                <div class="flex items-center gap-8">
                    <div class="text-[#E60023] font-black text-3xl cursor-pointer">V</div>
                    <nav class="hidden md:flex gap-8 font-bold text-sm">
                        <button onclick="tab('home')" id="t-home" class="text-black border-b-2 border-black pb-1">Beranda</button>
                        <button onclick="tab('neo')" id="t-neo" class="text-gray-400 hover:text-black transition-colors">Neo Visual</button>
                        <button onclick="tab('ootd')" id="t-ootd" class="text-gray-400 hover:text-black transition-colors">OOTD Trend</button>
                        <button onclick="tab('msg')" id="t-msg" class="text-gray-400 hover:text-black transition-colors">Pesan</button>
                    </nav>
                </div>
                <div class="flex-1 max-w-xl mx-8 hidden md:block">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                        <input type="text" placeholder="Cari gaya, desain, atau seni..." class="w-full bg-gray-100 rounded-full py-3 pl-12 pr-4 border-none focus:ring-2 focus:ring-red-100 text-sm">
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="toggleDrawer()" class="w-10 h-10 rounded-full bg-gray-200 border-2 border-white shadow-sm overflow-hidden">
                        <img id="u-pfp" src="" class="w-full h-full object-cover">
                    </button>
                </div>
            </header>

            <main class="pt-24 pb-24 px-4 md:px-8">
                <div id="view-home" class="tab-v masonry-grid"></div>

                <div id="view-neo" class="tab-v hidden max-w-2xl mx-auto py-10">
                    <div class="glass-ui p-10 rounded-[50px] shadow-2xl border-white border">
                        <h2 class="text-3xl font-black mb-2 tracking-tighter text-[#E60023]">Neo Generator</h2>
                        <p class="text-gray-500 text-sm mb-10">Visualisasikan ide video cinematic dengan Google Veo 3.</p>
                        <div class="space-y-6">
                            <textarea id="ai-prompt" rows="4" class="w-full bg-gray-50 rounded-[30px] p-6 border-none focus:ring-2 focus:ring-red-100 text-sm italic" placeholder="Contoh: Drone shot melintasi pegunungan salju saat matahari terbenam..."></textarea>
                            <button onclick="processAI('neo')" id="ai-btn" class="w-full bg-[#E60023] text-white py-5 rounded-[25px] font-bold shadow-2xl shadow-red-200 flex items-center justify-center gap-3 active:scale-95 transition-all">
                                <i data-lucide="wand-2" class="w-6 h-6"></i> Generate Visual
                            </button>
                        </div>
                    </div>
                    <div id="ai-result" class="mt-8 hidden animate-bounce-in">
                        <div class="bg-black text-white p-8 rounded-[40px] shadow-2xl border-4 border-white italic leading-relaxed text-center">
                            <p id="ai-text"></p>
                        </div>
                    </div>
                </div>

                <div id="view-ootd" class="tab-v hidden max-w-2xl mx-auto py-10">
                    <div class="glass-ui p-10 rounded-[50px] shadow-2xl border-white border bg-pink-50/30">
                        <h2 class="text-3xl font-black mb-2 tracking-tighter text-[#E60023]">OOTD Visualizer</h2>
                        <p class="text-gray-500 text-sm mb-10">Dapatkan saran gaya busana otomatis berdasarkan preferensimu.</p>
                        <div class="space-y-6">
                            <div class="grid grid-cols-2 gap-4">
                                <select id="ootd-gender" class="bg-gray-50 p-4 rounded-2xl border-none text-sm">
                                    <option>Pria</option>
                                    <option>Wanita</option>
                                </select>
                                <select id="ootd-style" class="bg-gray-50 p-4 rounded-2xl border-none text-sm">
                                    <option>Casual</option>
                                    <option>Formal</option>
                                    <option>Streetwear</option>
                                    <option>Vintage</option>
                                </select>
                            </div>
                            <textarea id="ootd-prompt" rows="2" class="w-full bg-gray-50 rounded-2xl p-4 border-none text-sm" placeholder="Tambahkan detail (warna favorit, cuaca)..."></textarea>
                            <button onclick="processAI('ootd')" class="w-full bg-black text-white py-5 rounded-2xl font-bold flex items-center justify-center gap-3 active:scale-95 transition-all">
                                <i data-lucide="shirt" class="w-6 h-6"></i> Analisis Gaya
                            </button>
                        </div>
                    </div>
                    <div id="ootd-result" class="mt-8 hidden">
                        <div class="bg-white p-8 rounded-[40px] shadow-xl border border-gray-100">
                            <h4 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="sparkles" class="text-yellow-500"></i> Rekomendasi VisiAura:</h4>
                            <p id="ootd-text" class="text-sm text-gray-600 leading-relaxed"></p>
                        </div>
                    </div>
                </div>

                <div id="view-msg" class="tab-v hidden max-w-2xl mx-auto h-[75vh] glass-ui rounded-[50px] flex flex-col overflow-hidden border">
                    <div class="p-6 border-b flex items-center justify-between">
                        <span class="font-black text-xl">Forum Aura</span>
                        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                    </div>
                    <div id="chat-stream" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50/20"></div>
                    <div class="p-4 bg-white border-t flex gap-3">
                        <input id="chat-in" type="text" placeholder="Bagikan ide..." class="flex-1 bg-gray-100 rounded-2xl px-6 py-4 text-sm border-none">
                        <button onclick="send()" class="bg-[#E60023] text-white p-4 rounded-2xl shadow-lg"><i data-lucide="send"></i></button>
                    </div>
                </div>
            </main>

            <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-gray-100 p-4 flex justify-around items-center z-[100]">
                <button onclick="tab('home')" class="text-black"><i data-lucide="home"></i></button>
                <button onclick="tab('neo')" class="text-gray-400"><i data-lucide="video"></i></button>
                <button onclick="tab('ootd')" class="text-gray-400"><i data-lucide="shirt"></i></button>
                <button onclick="tab('msg')" class="text-gray-400"><i data-lucide="message-square"></i></button>
            </nav>
        </section>

        <div id="drawer-bg" onclick="toggleDrawer()" class="fixed inset-0 bg-black/40 z-[1000] hidden backdrop-blur-sm"></div>
        <div id="account-drawer" class="fixed bottom-0 left-0 right-0 bg-white z-[1001] rounded-t-[50px] p-10 shadow-2xl max-h-[85vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-10"></div>
            <div class="flex items-center gap-6 mb-10">
                <img id="d-pfp" src="" class="w-20 h-20 rounded-full border-4 border-gray-50 shadow-sm">
                <div>
                    <h3 id="d-name" class="text-2xl font-black">User</h3>
                    <p id="d-id" class="text-gray-400 text-xs font-mono"></p>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-4">
                <button class="w-full text-left p-5 hover:bg-gray-50 rounded-3xl flex items-center justify-between group">
                    <div class="flex items-center gap-4">
                        <i data-lucide="layout" class="text-gray-400"></i>
                        <span class="font-bold">Papan Saya</span>
                    </div>
                    <i data-lucide="chevron-right" class="text-gray-300 group-hover:translate-x-1 transition-transform"></i>
                </button>
                <button onclick="location.reload()" class="w-full text-left p-5 text-red-600 font-bold hover:bg-red-50 rounded-3xl flex items-center gap-4">
                    <i data-lucide="log-out"></i> Keluar Aplikasi
                </button>
            </div>
        </div>

        <div id="loader" class="fixed inset-0 bg-white z-[5000] hidden flex flex-col items-center justify-center">
            <div class="w-16 h-16 border-4 border-gray-100 border-t-[#E60023] rounded-full animate-spin"></div>
            <p id="loader-text" class="mt-6 font-black tracking-widest text-sm text-gray-400 uppercase">MENSINKRONISASI AURA...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCClWupRb5ETPWm-tQ_-x4U9K0dZ5CjPKQ",
            authDomain: "visiaura-87251.firebaseapp.com",
            projectId: "visiaura-87251",
            storageBucket: "visiaura-87251.firebasestorage.app",
            messagingSenderId: "999783403118",
            appId: "1:999783403118:web:436dd872d599e7f5eaa07f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = "visiaura-87251";
        const apiKey = ""; 

        let user = null;

        lucide.createIcons();

        window.loginGoogle = () => signInWithPopup(auth, provider);
        window.loginGuest = () => signInAnonymously(auth);

        onAuthStateChanged(auth, async (u) => {
            if (u) {
                user = u;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                initUser();
            }
        });

        const initUser = async () => {
            const pfp = user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName || 'Guest'}&background=E60023&color=fff`;
            document.getElementById('u-pfp').src = pfp;
            document.getElementById('d-pfp').src = pfp;
            document.getElementById('d-name').innerText = user.displayName || "User Aura";
            document.getElementById('d-id').innerText = user.uid;

            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), {
                name: user.displayName || "Guest",
                lastActive: serverTimestamp()
            }, { merge: true });

            loadPins();
            initChat();
        };

        const loadPins = () => {
            const container = document.getElementById('view-home');
            const categories = ['fashion', 'interior', 'nature', 'technology', 'architecture', 'minimalist', 'cars', 'portrait'];
            const pins = [];
            
            for(let i = 0; i < 50; i++) {
                const cat = categories[Math.floor(Math.random() * categories.length)];
                const height = 300 + Math.floor(Math.random() * 300);
                pins.push({
                    id: i,
                    h: height,
                    img: `https://picsum.photos/seed/${i + 100}/500/${height}`,
                    t: `Inspirasi ${cat.charAt(0).toUpperCase() + cat.slice(1)} #${i+1}`
                });
            }

            container.innerHTML = pins.map(p => `
                <div class="pin-item group">
                    <img src="${p.img}" loading="lazy" style="height: ${p.h}px; width: 100%; object-fit: cover;">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity p-4 flex flex-col justify-between">
                        <div class="flex justify-end">
                            <button onclick="savePin()" class="bg-[#E60023] text-white px-5 py-2.5 rounded-full text-sm font-bold active:scale-90 transition-transform">Simpan</button>
                        </div>
                        <div class="flex items-center justify-between text-white">
                            <span class="text-xs font-bold truncate pr-2">${p.t}</span>
                            <div class="w-8 h-8 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center">
                                <i data-lucide="external-link" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        };

        window.tab = (id) => {
            document.querySelectorAll('.tab-v').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${id}`).classList.remove('hidden');
            
            const navs = ['home', 'neo', 'ootd', 'msg'];
            navs.forEach(n => {
                const el = document.getElementById(`t-${n}`);
                if(n === id) el.className = "text-black border-b-2 border-black pb-1 font-bold";
                else el.className = "text-gray-400 hover:text-black transition-colors font-bold";
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.toggleDrawer = () => {
            document.getElementById('account-drawer').classList.toggle('active');
            document.getElementById('drawer-bg').classList.toggle('hidden');
        };

        const initChat = () => {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), orderBy('time', 'asc'));
            onSnapshot(q, (snap) => {
                const stream = document.getElementById('chat-stream');
                stream.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const isMe = m.uid === user?.uid;
                    const div = document.createElement('div');
                    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                    div.innerHTML = `
                        <div class="max-w-[80%] p-4 rounded-3xl text-sm ${isMe ? 'bg-[#E60023] text-white rounded-tr-none' : 'bg-white border rounded-tl-none shadow-sm'}">
                            <p class="text-[10px] font-black opacity-60 mb-1">${m.name}</p>
                            ${m.text}
                        </div>
                    `;
                    stream.appendChild(div);
                });
                stream.scrollTop = stream.scrollHeight;
            });
        };

        window.send = async () => {
            const input = document.getElementById('chat-in');
            const txt = input.value.trim();
            if(!txt || !user) return;
            input.value = "";
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                text: txt,
                uid: user.uid,
                name: user.displayName || "Guest",
                time: serverTimestamp()
            });
        };

        window.processAI = async (type) => {
            let prompt = "";
            let targetTextId = "";
            let targetViewId = "";
            let systemPrompt = "";

            if(type === 'neo') {
                prompt = document.getElementById('ai-prompt').value.trim();
                targetTextId = 'ai-text';
                targetViewId = 'ai-result';
                systemPrompt = "Kamu adalah Google Veo 3 Engine. Deskripsikan video cinematic pendek secara teknis dan puitis dalam Bahasa Indonesia.";
            } else {
                const gender = document.getElementById('ootd-gender').value;
                const style = document.getElementById('ootd-style').value;
                const note = document.getElementById('ootd-prompt').value;
                prompt = `Gaya: ${style}, Gender: ${gender}, Catatan: ${note}`;
                targetTextId = 'ootd-text';
                targetViewId = 'ootd-result';
                systemPrompt = "Kamu adalah Fashion Stylist VisiAura. Berikan saran OOTD mendalam termasuk atasan, bawahan, sepatu, dan aksesoris dalam Bahasa Indonesia.";
            }

            if(prompt.length < 5) return showToast("Berikan detail lebih banyak", "error");

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('loader-text').innerText = type === 'neo' ? "Generating Visual..." : "Analyzing Style...";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${systemPrompt}\n\nUser Prompt: ${prompt}` }] }]
                    })
                });
                const data = await res.json();
                const output = data.candidates[0].content.parts[0].text;
                
                document.getElementById(targetViewId).classList.remove('hidden');
                document.getElementById(targetTextId).innerText = output;
                showToast("Analisis Selesai!");
            } catch (e) {
                showToast("Gagal memproses AI", "error");
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        };

        window.savePin = () => showToast("Tersimpan di Papan Aura!");

        const showToast = (msg, type="success") => {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `p-4 rounded-2xl shadow-2xl flex items-center gap-3 border bg-white animate-bounce-in`;
            t.innerHTML = `
                <div class="${type === 'success' ? 'text-green-500' : 'text-red-500'}">
                    <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}"></i>
                </div>
                <span class="text-xs font-bold">${msg}</span>
            `;
            container.appendChild(t);
            lucide.createIcons();
            setTimeout(() => t.remove(), 3000);
        };

        const initBg = () => {
            const bg = document.getElementById('bg-visuals');
            for(let i=0; i<15; i++) {
                const c = document.createElement('div');
                c.className = "floating-card w-32 h-48 bg-gray-50 rounded-2xl border border-gray-100 shadow-sm";
                c.style.left = (Math.random() * 100) + "vw";
                c.style.animationDelay = (Math.random() * 10) + "s";
                bg.appendChild(c);
            }
        };
        initBg();

    </script>

    <style>
        @keyframes bounce-in {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in { animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</body>
</html>
