<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisiAura Pro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root { --aura-red: #E60023; }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.4s, color 0.4s; }
        body.dark { background: #0a0a0a; color: #ffffff; }
        body.dark .bg-white { background: #121212 !important; color: white; border-color: #222 !important; }
        body.dark .bg-gray-50 { background: #1a1a1a !important; }
        body.dark .bg-gray-100 { background: #222 !important; color: white; }
        body.dark header { background: rgba(10, 10, 10, 0.8) !important; border-color: #222; }
        body.dark .pin-card { background: #1a1a1a; border-color: #222; }

        .masonry { column-count: 2; column-gap: 12px; }
        @media (min-width: 768px) { .masonry { column-count: 3; } }
        @media (min-width: 1024px) { .masonry { column-count: 5; } }

        .pin-card { break-inside: avoid; margin-bottom: 12px; border-radius: 20px; overflow: hidden; position: relative; transition: 0.3s; }
        .pin-card img, .pin-card video { width: 100%; display: block; height: auto; border-radius: 20px; }

        #acc-drawer { transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1); }
        #acc-drawer.open { transform: translateY(0); }

        .tab-content { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #toast { transform: translateX(-50%) translateY(100px); transition: 0.3s; }
        #toast.show { transform: translateX(-50%) translateY(-20px); }
    </style>
</head>
<body class="bg-white">

<div id="app-root">
    <div id="toast" class="fixed bottom-24 left-1/2 bg-black text-white px-6 py-3 rounded-2xl text-xs font-bold z-[10000] shadow-2xl flex items-center gap-3">
        <i data-lucide="bell" class="w-4 h-4 text-red-500"></i>
        <span id="toast-msg">Notifikasi Baru</span>
    </div>

    <input type="file" id="file-upload" class="hidden" accept="image/*,video/*">

    <section id="auth-section" class="fixed inset-0 bg-white z-[5000] flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center">
            <div class="w-20 h-20 bg-[#E60023] rounded-[30%] mx-auto mb-6 flex items-center justify-center text-white shadow-xl rotate-6">
                <i data-lucide="sparkles" class="w-10 h-10"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tighter mb-2">VisiAura<span class="text-[#E60023]">.</span></h1>
            <p class="text-gray-400 font-medium mb-10 text-sm">Visualisasikan estetika impianmu.</p>
            <div class="space-y-3">
                <button onclick="login('google')" class="w-full py-4 rounded-2xl border border-gray-100 font-bold flex items-center justify-center gap-4 hover:bg-gray-50 transition-all text-sm">
                    <img src="https://ik.imagekit.io/Kenzo/IMG_20251226_162306.jpg?updatedAt=1766741300056" class="w-5 h-5"> Google Login
                </button>
                <button onclick="login('guest')" class="w-full bg-black text-white py-4 rounded-2xl font-bold shadow-lg text-sm">Guest Mode</button>
            </div>
        </div>
    </section>

    <section id="main-section" class="hidden min-h-screen">
        <header class="fixed top-0 inset-x-0 bg-white/80 backdrop-blur-xl z-[200] px-4 md:px-8 py-4 flex items-center gap-4 border-b border-gray-50">
            <div class="text-[#E60023] font-black text-2xl">V</div>
            
            <div class="flex-1 relative">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                <input type="text" id="main-search" oninput="handleSearch(this.value)" placeholder="Cari 'Gunung', 'Pantai', 'Streetwear'..." class="w-full bg-gray-100 focus:bg-white focus:ring-4 focus:ring-red-50 rounded-full py-3 pl-12 pr-12 border-none transition-all text-sm outline-none">
                <button onclick="visualSearch()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#E60023]">
                    <i data-lucide="camera" class="w-4 h-4"></i>
                </button>
            </div>

            <button onclick="triggerUpload()" class="w-11 h-11 bg-black text-white rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
            
            <button onclick="toggleAccount()" class="w-11 h-11 rounded-xl bg-gray-100 overflow-hidden border border-gray-100 shadow-sm">
                <img id="u-pfp" src="" class="w-full h-full object-cover">
            </button>
        </header>

        <main class="pt-24 pb-32 px-4 md:px-8 max-w-[1600px] mx-auto">
            <div id="view-home" class="tab-content masonry"></div>

            <div id="view-neo" class="tab-content hidden max-w-xl mx-auto py-8">
                <div class="bg-white p-8 rounded-[40px] shadow-2xl border">
                    <h2 class="text-3xl font-black mb-4 tracking-tighter">Neo <span class="text-red-600">AI</span></h2>
                    <textarea id="neo-prompt" rows="4" class="w-full bg-gray-50 rounded-3xl p-6 border-none text-sm" placeholder="Ceritakan video estetika yang ingin kamu buat..."></textarea>
                    <button onclick="runGemini('neo')" class="w-full mt-4 bg-[#E60023] text-white py-4 rounded-2xl font-black">GENERATE VISUAL</button>
                </div>
                <div id="neo-res" class="mt-6 hidden p-8 bg-black text-white rounded-[30px] text-sm"></div>
            </div>

            <div id="view-ootd" class="tab-content hidden max-w-xl mx-auto py-8">
                <div class="bg-white p-8 rounded-[40px] shadow-2xl border">
                    <h2 class="text-3xl font-black mb-6 tracking-tighter">OOTD Analysis</h2>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <select id="ootd-gen" class="p-4 bg-gray-50 rounded-xl border-none font-bold text-sm">
                            <option>Wanita</option><option>Pria</option>
                        </select>
                        <select id="ootd-style" class="p-4 bg-gray-50 rounded-xl border-none font-bold text-sm">
                            <option>Streetwear</option><option>Minimalist</option><option>Vintage</option><option>Old Money</option>
                        </select>
                    </div>
                    <button onclick="runGemini('ootd')" class="w-full bg-black text-white py-4 rounded-2xl font-black">GET IDEAS</button>
                </div>
                <div id="ootd-res" class="mt-6 hidden p-8 bg-white border rounded-[30px] shadow-lg text-sm"></div>
            </div>

            <div id="view-chat" class="tab-content hidden max-w-2xl mx-auto h-[60vh] flex flex-col bg-white rounded-[40px] shadow-2xl border">
                <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
                <div class="p-4 bg-white border-t flex gap-3">
                    <input id="msg-in" type="text" placeholder="Kirim pesan..." class="flex-1 bg-gray-100 rounded-xl px-4 py-3 border-none">
                    <button onclick="sendMsg()" class="bg-[#E60023] text-white p-3 rounded-xl"><i data-lucide="send"></i></button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-xl border border-gray-100 shadow-2xl rounded-full px-8 py-4 flex items-center gap-10 z-[200]">
            <button onclick="changeTab('home')" id="btn-h" class="text-[#E60023]"><i data-lucide="home"></i></button>
            <button onclick="changeTab('neo')" id="btn-n" class="text-gray-400 hover:text-black"><i data-lucide="video"></i></button>
            <button onclick="changeTab('ootd')" id="btn-o" class="text-gray-400 hover:text-black"><i data-lucide="shirt"></i></button>
            <button onclick="changeTab('chat')" id="btn-c" class="text-gray-400 hover:text-black"><i data-lucide="message-square"></i></button>
        </nav>
    </section>

    <div id="acc-overlay" onclick="toggleAccount()" class="fixed inset-0 bg-black/40 z-[1000] hidden backdrop-blur-sm"></div>
    <div id="acc-drawer" class="fixed bottom-0 left-0 right-0 bg-white z-[1001] rounded-t-[50px] p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="w-12 h-1.5 bg-gray-100 rounded-full mx-auto mb-8"></div>
        
        <div class="flex items-center gap-6 mb-8">
            <img id="d-pfp" src="" class="w-20 h-20 rounded-[35%] border-4 border-gray-50 shadow-md">
            <div class="flex-1">
                <h3 id="d-name" class="text-2xl font-black tracking-tighter">User Aura</h3>
                <p id="d-mail" class="text-gray-400 text-xs mb-2"></p>
                <div class="flex gap-2">
                    <span class="bg-red-50 text-[#E60023] text-[9px] px-2 py-0.5 rounded-full font-black">PRO</span>
                    <span class="bg-blue-50 text-blue-600 text-[9px] px-2 py-0.5 rounded-full font-black">VERIFIED</span>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="p-6 bg-gray-50 rounded-[35px] space-y-4">
                    <h4 class="font-black text-xs uppercase text-gray-400">Tampilan</h4>
                    <div class="flex flex-col gap-3">
                        <button onclick="setTheme('light')" class="flex items-center justify-between p-3 bg-white rounded-xl text-xs font-bold border border-gray-100">Light Mode <i data-lucide="sun" class="w-4 h-4"></i></button>
                        <button onclick="setTheme('dark')" class="flex items-center justify-between p-3 bg-white rounded-xl text-xs font-bold border border-gray-100">Dark Mode <i data-lucide="moon" class="w-4 h-4"></i></button>
                        <button onclick="setTheme('auto')" class="flex items-center justify-between p-3 bg-white rounded-xl text-xs font-bold border border-gray-100">Auto HP <i data-lucide="smartphone" class="w-4 h-4"></i></button>
                    </div>
                </div>
                <div class="p-6 bg-gray-50 rounded-[35px] space-y-4">
                    <h4 class="font-black text-xs uppercase text-gray-400">Keamanan</h4>
                    <div class="flex flex-col gap-3">
                        <div class="flex items-center justify-between p-3 bg-white rounded-xl text-xs font-bold border border-gray-100">Notifikasi <input type="checkbox" id="notif-toggle" checked onchange="handleNotifToggle(this)"></div>
                        <div class="flex items-center justify-between p-3 bg-white rounded-xl text-xs font-bold border border-gray-100">Privasi <i data-lucide="lock" class="w-4 h-4"></i></div>
                        <div class="flex items-center justify-between p-3 bg-white rounded-xl text-xs font-bold border border-gray-100">Aura AI <i data-lucide="cpu" class="w-4 h-4"></i></div>
                    </div>
                </div>
            </div>

            <div class="p-6 bg-gray-50 rounded-[35px] space-y-4">
                <h4 class="font-black text-xs uppercase text-gray-400">Akun Terdaftar</h4>
                <div id="account-list" class="space-y-2"></div>
                <button onclick="login('google')" class="w-full py-4 border-2 border-dashed border-gray-200 rounded-2xl text-gray-400 font-bold text-xs hover:border-black transition-all">+ Tambah Akun Baru</button>
                <button onclick="logout()" class="w-full py-4 bg-red-100 text-[#E60023] rounded-2xl font-black text-xs">KELUAR DARI SEMUA SESI</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCClWupRb5ETPWm-tQ_-x4U9K0dZ5CjPKQ",
        authDomain: "visiaura-87251.firebaseapp.com",
        projectId: "visiaura-87251",
        storageBucket: "visiaura-87251.firebasestorage.app",
        messagingSenderId: "999783403118",
        appId: "1:999783403118:web:436dd872d599e7f5eaa07f"
    };

    /**
     * PETUNJUK AKSES GEMINI AI:
     * 1. Buka https://aistudio.google.com/
     * 2. Buat API Key baru.
     * 3. Masukkan key tersebut di variabel geminiKey di bawah ini.
     */
    const geminiKey = ""; 

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    const appId = "visiaura-87251";

    let currentUser = null;
    let localPins = []; 

    window.login = (type) => type === 'google' ? signInWithPopup(auth, provider) : signInAnonymously(auth);
    window.logout = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, (u) => {
        if (u) {
            currentUser = u;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            initApp();
            saveSession(u);
            showToast(`Selamat datang kembali, ${u.displayName || 'User'}!`);
        }
    });

    const initApp = () => {
        const pfp = currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.displayName || 'G'}&background=E60023&color=fff`;
        document.getElementById('u-pfp').src = pfp;
        document.getElementById('d-pfp').src = pfp;
        document.getElementById('d-name').innerText = currentUser.displayName || "Explorer";
        document.getElementById('d-mail').innerText = currentUser.email || "No Email linked";
        
        generatePins();
        setupChat();
        applySavedTheme();
        lucide.createIcons();
    };

    const generatePins = () => {
        const keywords = ['Gunung', 'Pantai', 'City', 'Fashion', 'Cyberpunk', 'Interior', 'Art', 'Nature'];
        localPins = [];
        for(let i=0; i<75; i++) {
            const tag = keywords[Math.floor(Math.random() * keywords.length)];
            localPins.push({
                id: i,
                url: `https://picsum.photos/seed/${i+100}/500/${250 + Math.floor(Math.random() * 300)}`,
                tag: tag,
                type: 'image'
            });
        }
        renderPins(localPins);
    };

    const renderPins = (data) => {
        const container = document.getElementById('view-home');
        container.innerHTML = data.map(p => `
            <div class="pin-card group animate-fadeIn">
                ${p.type === 'image' ? 
                    `<img src="${p.url}" loading="lazy" alt="${p.tag}">` : 
                    `<video src="${p.url}" autoplay muted loop class="rounded-2xl"></video>`
                }
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-all p-4 flex flex-col justify-end">
                    <p class="text-white text-[10px] font-black uppercase tracking-widest">${p.tag}</p>
                </div>
            </div>
        `).join('');
    };

    window.handleSearch = (val) => {
        const filtered = localPins.filter(p => p.tag.toLowerCase().includes(val.toLowerCase()));
        renderPins(filtered);
    };

    window.triggerUpload = () => document.getElementById('file-upload').click();

    document.getElementById('file-upload').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;

        const url = URL.createObjectURL(file);
        const type = file.type.startsWith('video') ? 'video' : 'image';
        
        localPins.unshift({ id: Date.now(), url, tag: 'Unggahan Anda', type });
        renderPins(localPins);
        showToast("Visual berhasil diunggah ke grid!");
    };

    window.runGemini = async (type) => {
        if(!geminiKey) return showToast("API Key Gemini belum diset!");
        const input = type === 'neo' ? document.getElementById('neo-prompt').value : `Gaya ${document.getElementById('ootd-style').value}`;
        const resBox = document.getElementById(type === 'neo' ? 'neo-res' : 'ootd-res');
        
        showToast("Memproses Visual AI...");
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: input + " (Balas dalam Bahasa Indonesia)" }] }] })
            });
            const d = await r.json();
            resBox.innerText = d.candidates[0].content.parts[0].text;
            resBox.classList.remove('hidden');
        } catch (e) { showToast("Gagal terhubung ke AI."); }
    };

    window.setTheme = (mode) => {
        localStorage.setItem('aura-theme', mode);
        applySavedTheme();
    };

    const applySavedTheme = () => {
        const mode = localStorage.getItem('aura-theme') || 'auto';
        if(mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
    };

    const setupChat = () => {
        const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), orderBy('time', 'asc'));
        onSnapshot(q, (snap) => {
            const box = document.getElementById('chat-box');
            box.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                box.innerHTML += `<div class="p-3 bg-gray-50 dark:bg-zinc-800 rounded-2xl text-xs font-medium"><b>${m.name}:</b> ${m.text}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    window.sendMsg = async () => {
        const msg = document.getElementById('msg-in').value;
        if(!msg) return;
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
            text: msg, name: currentUser.displayName || "User", time: serverTimestamp()
        });
        document.getElementById('msg-in').value = "";
    };

    window.showToast = (msg) => {
        const t = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    };

    window.toggleAccount = () => {
        document.getElementById('acc-drawer').classList.toggle('open');
        document.getElementById('acc-overlay').classList.toggle('hidden');
    };

    window.changeTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.getElementById(`view-${id}`).classList.remove('hidden');
        ['h','n','o','c'].forEach(k => document.getElementById(`btn-${k}`).classList.replace('text-[#E60023]', 'text-gray-400'));
        document.getElementById(`btn-${id.charAt(0)}`).classList.replace('text-gray-400', 'text-[#E60023]');
    };

    const saveSession = (u) => {
        let vault = JSON.parse(localStorage.getItem('va_multi_vault') || '[]');
        if(!vault.find(a => a.uid === u.uid)) {
            vault.push({ uid: u.uid, name: u.displayName || 'Guest', pfp: u.photoURL });
            localStorage.setItem('va_multi_vault', JSON.stringify(vault));
        }
        document.getElementById('account-list').innerHTML = vault.map(a => `
            <div class="p-3 bg-white dark:bg-zinc-800 rounded-xl border border-gray-100 flex items-center justify-between text-xs font-bold">
                <div class="flex items-center gap-3"><img src="${a.pfp || 'https://via.placeholder.com/30'}" class="w-6 h-6 rounded-full">${a.name}</div>
                ${a.uid === currentUser.uid ? '<span class="text-[#E60023]">AKTIF</span>' : ''}
            </div>
        `).join('');
    };

    window.visualSearch = () => showToast("Fitur Visual Search Kamera sedang disinkronkan...");
    window.handleNotifToggle = (el) => showToast(el.checked ? "Notifikasi diaktifkan" : "Notifikasi dibisukan");

    lucide.createIcons();
</script>
</body>
</html>
