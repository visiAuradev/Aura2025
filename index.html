<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisiAura Pro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root { --aura-red: #E60023; }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.4s, color 0.4s; overflow-x: hidden; }
        
        body.dark { background: #0a0a0a; color: #ffffff; }
        body.dark .bg-white { background: #121212 !important; color: white; border-color: #222 !important; }
        body.dark header { background: rgba(10, 10, 10, 0.8) !important; border-bottom: 1px solid #222; }
        body.dark .bg-gray-50 { background: #1a1a1a !important; }
        body.dark .pin-card { background: #1a1a1a; border: 1px solid #222; }

        .masonry { column-count: 2; column-gap: 12px; }
        @media (min-width: 768px) { .masonry { column-count: 3; } }
        @media (min-width: 1024px) { .masonry { column-count: 5; } }

        .pin-card { break-inside: avoid; margin-bottom: 12px; border-radius: 24px; overflow: hidden; position: relative; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: zoom-in; }
        .pin-card:hover { transform: scale(1.02); }
        .pin-card img { width: 100%; border-radius: 24px; display: block; }

        #acc-drawer { transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1); }
        #acc-drawer.open { transform: translateY(0); }
        
        #toast { 
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .tab-content { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-white">

<div id="app-root">
    <div id="toast">
        <i data-lucide="bell-ring" class="w-4 h-4 text-red-500"></i>
        <span id="toast-msg">Sistem Siap</span>
    </div>

    <input type="file" id="file-upload" class="hidden" accept="image/*,video/*">
    <input type="file" id="camera-capture" class="hidden" accept="image/*" capture="environment">

    <section id="auth-section" class="fixed inset-0 bg-white z-[5000] flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center">
            <div class="w-24 h-24 bg-[#E60023] rounded-[38%] mx-auto mb-8 flex items-center justify-center text-white shadow-2xl rotate-6">
                <i data-lucide="sparkle" class="w-12 h-12"></i>
            </div>
            <h1 class="text-5xl font-extrabold tracking-tighter mb-4 italic">VisiAura<span class="text-[#E60023]">.</span></h1>
            <p class="text-gray-400 font-medium mb-12 text-sm px-6">Gabungan visual cerdas dan eksplorasi gaya hidup masa depan.</p>
            <div class="space-y-4">
                <button onclick="login('google')" class="w-full py-4 rounded-2xl border border-gray-100 font-bold flex items-center justify-center gap-4 hover:bg-gray-50 transition-all text-sm shadow-sm text-black">
                    <img src="https://ik.imagekit.io/Kenzo/IMG_20251226_162306.jpg?updatedAt=1766741300056" class="w-5 h-5"> Goggle
                </button>
                <button onclick="login('guest')" class="w-full bg-black text-white py-4 rounded-2xl font-bold shadow-lg text-sm">Guest</button>
            </div>
        </div>
    </section>

    <section id="main-section" class="hidden min-h-screen">
        <header class="fixed top-0 inset-x-0 bg-white/80 backdrop-blur-xl z-[200] px-4 md:px-8 py-4 flex items-center gap-4 border-b border-gray-50">
            <div class="text-[#E60023] font-black text-2xl">V</div>
            
            <div class="flex-1 relative">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                <input type="text" id="main-search" oninput="handleSearch(this.value)" placeholder="Cari aura: Minimalist, Street, Art..." class="w-full bg-gray-100 focus:bg-white focus:ring-4 focus:ring-red-50 rounded-full py-3 pl-12 pr-12 border-none transition-all text-sm outline-none text-black">
                <button onclick="openCamera()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#E60023] p-1">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                </button>
            </div>

            <button onclick="triggerUpload()" class="w-11 h-11 bg-black text-white rounded-full flex items-center justify-center shadow-lg hover:scale-110 active:scale-90 transition-all">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
            
            <button onclick="toggleAccount()" class="w-11 h-11 rounded-2xl bg-gray-100 overflow-hidden border border-gray-100 shadow-sm transition-transform active:scale-90">
                <img id="u-pfp" src="" class="w-full h-full object-cover">
            </button>
        </header>

        <main class="pt-24 pb-32 px-4 md:px-8 max-w-[1600px] mx-auto">
            <div id="view-home" class="tab-content masonry"></div>

            <div id="view-neo" class="tab-content hidden max-w-xl mx-auto py-8">
                <div class="bg-white p-8 rounded-[40px] shadow-2xl border border-gray-50">
                    <div class="flex items-center gap-3 mb-2">
                        <i data-lucide="zap" class="text-orange-500 w-6 h-6"></i>
                        <h2 class="text-3xl font-black tracking-tighter text-black">Neo <span class="text-orange-600">AI</span></h2>
                    </div>
                    <p class="text-[10px] text-gray-400 mb-6 uppercase tracking-[3px] font-bold">Creative Vision Intel</p>
                    <textarea id="neo-prompt" rows="4" class="w-full bg-gray-50 rounded-3xl p-6 border-none text-sm outline-none focus:ring-2 focus:ring-orange-100 transition-all text-black" placeholder="Deskripsikan aura visual yang ingin kamu buat..."></textarea>
                    <button id="btn-neo" onclick="runGemini('neo')" class="w-full mt-4 bg-orange-600 text-white py-4 rounded-2xl font-black shadow-lg">SEBENTAR AURA BUAT</button>
                </div>
                <div id="neo-res" class="mt-6 hidden p-8 bg-black text-white rounded-[30px] text-sm italic leading-relaxed shadow-xl border-t-4 border-orange-600"></div>
            </div>

            <div id="view-ootd" class="tab-content hidden max-w-xl mx-auto py-8">
                <div class="bg-white p-8 rounded-[40px] shadow-2xl border border-gray-50">
                    <h2 class="text-3xl font-black mb-6 tracking-tighter text-black">OOTD AI Trend</h2>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <select id="ootd-gen" class="p-4 bg-gray-50 rounded-xl border-none font-bold text-xs outline-none text-black">
                            <option>Pria</option><option>Wanita</option><option>Unisex</option>
                        </select>
                        <select id="ootd-style" class="p-4 bg-gray-50 rounded-xl border-none font-bold text-xs outline-none text-black">
                            <option>Streetwear</option><option>Old Money</option><option>Vintage</option><option>Minimalist</option><option>Techwear</option>
                        </select>
                    </div>
                    <button id="btn-ootd" onclick="runGemini('ootd')" class="w-full bg-black text-white py-4 rounded-2xl font-black shadow-lg">REKOMENDASI GAYA</button>
                </div>
                <div id="ootd-res" class="mt-6 hidden p-8 bg-white border border-gray-100 rounded-[30px] shadow-lg text-sm text-gray-700 leading-relaxed"></div>
            </div>

            <div id="view-chat" class="tab-content hidden max-w-2xl mx-auto h-[65vh] flex flex-col bg-white rounded-[40px] shadow-2xl overflow-hidden border">
                <div class="p-6 border-b flex justify-between items-center">
                    <h3 class="font-black text-lg text-black">Aura Lounge</h3>
                    <span class="text-[10px] bg-green-100 text-green-600 px-3 py-1 rounded-full font-black animate-pulse">LIVE</span>
                </div>
                <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50/20"></div>
                <div class="p-4 bg-white border-t flex gap-3">
                    <input id="msg-in" type="text" placeholder="Bagikan ide auramu..." class="flex-1 bg-gray-100 rounded-xl px-4 py-3 border-none text-sm outline-none text-black">
                    <button onclick="sendMsg()" class="bg-[#E60023] text-white p-3 rounded-xl shadow-lg active:scale-90"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-2xl border border-white/50 shadow-2xl rounded-full px-8 py-5 flex items-center gap-10 z-[200]">
            <button onclick="changeTab('home')" id="btn-h" class="text-[#E60023]"><i data-lucide="home"></i></button>
            <button onclick="changeTab('neo')" id="btn-n" class="text-gray-400 hover:text-black"><i data-lucide="video"></i></button>
            <button onclick="changeTab('ootd')" id="btn-o" class="text-gray-400 hover:text-black"><i data-lucide="shirt"></i></button>
            <button onclick="changeTab('chat')" id="btn-c" class="text-gray-400 hover:text-black"><i data-lucide="message-square"></i></button>
        </nav>
    </section>

    <div id="acc-overlay" onclick="toggleAccount()" class="fixed inset-0 bg-black/50 z-[1000] hidden backdrop-blur-md"></div>
    <div id="acc-drawer" class="fixed bottom-0 left-0 right-0 bg-white z-[1001] rounded-t-[50px] p-10 shadow-2xl max-h-[92vh] overflow-y-auto">
        <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-10"></div>
        
        <div class="flex items-center gap-8 mb-12">
            <img id="d-pfp" src="" class="w-24 h-24 rounded-[38%] border-4 border-white shadow-xl">
            <div>
                <h3 id="d-name" class="text-3xl font-black tracking-tighter text-black">Aura User</h3>
                <p id="d-mail" class="text-gray-400 text-xs font-medium"></p>
                <div class="flex gap-2 mt-2">
                    <span class="bg-red-50 text-[#E60023] text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-widest">VisiAura Pro</span>
                    <span id="aura-id-badge" class="bg-indigo-50 text-indigo-600 text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-widest"></span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-8 bg-gray-50 rounded-[40px] space-y-5">
                <h4 class="font-black text-[10px] uppercase text-gray-400 tracking-widest">Preferensi Visual</h4>
                <div class="flex flex-col gap-3">
                    <button onclick="setTheme('light')" class="flex items-center justify-between p-5 bg-white rounded-2xl text-xs font-bold shadow-sm transition-transform active:scale-95 text-black">Terang <i data-lucide="sun" class="w-4 h-4 text-orange-400"></i></button>
                    <button onclick="setTheme('dark')" class="flex items-center justify-between p-5 bg-white rounded-2xl text-xs font-bold shadow-sm transition-transform active:scale-95 text-black">Gelap <i data-lucide="moon" class="w-4 h-4 text-indigo-400"></i></button>
                    <button onclick="setTheme('auto')" class="flex items-center justify-between p-5 bg-white rounded-2xl text-xs font-bold shadow-sm transition-transform active:scale-95 text-black">Otomatis (HP) <i data-lucide="smartphone" class="w-4 h-4 text-green-400"></i></button>
                </div>
            </div>

            <div class="p-8 bg-gray-50 rounded-[40px] space-y-5">
                <h4 class="font-black text-[10px] uppercase text-gray-400 tracking-widest">Manajemen Sesi</h4>
                <div class="flex flex-col gap-3">
                    <button onclick="addNewAccount()" class="flex items-center justify-between p-5 bg-black text-white rounded-2xl text-xs font-black shadow-lg transition-transform hover:scale-105 active:scale-95">
                        Tambah Sesi Baru <i data-lucide="user-plus" class="w-4 h-4"></i>
                    </button>
                    <div class="flex items-center justify-between p-5 bg-white rounded-2xl text-xs font-bold shadow-sm text-black">
                        <span>Notifikasi Aktif</span>
                        <input type="checkbox" id="notif-toggle" checked onchange="toggleToastSystem(this)" class="accent-red-600 w-5 h-5 cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="p-8 bg-gray-50 rounded-[40px] md:col-span-2">
                <h4 class="font-black text-[10px] uppercase text-gray-400 tracking-widest mb-4">Aura Vault (Daftar Akun)</h4>
                <div id="vault-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6"></div>
                <button onclick="logout()" class="w-full py-5 bg-red-100 text-[#E60023] rounded-3xl font-black text-xs transition-transform active:scale-95">KELUAR & BERSIHKAN SESI</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCClWupRb5ETPWm-tQ_-x4U9K0dZ5CjPKQ",
        authDomain: "visiaura-87251.firebaseapp.com",
        projectId: "visiaura-87251",
        storageBucket: "visiaura-87251.firebasestorage.app",
        messagingSenderId: "999783403118",
        appId: "1:999783403118:web:436dd872d599e7f5eaa07f"
    };

    const geminiKey = "AIzaSyDd9HxPkOUHnYfw-N8r2_PQcZCBB2lJ-jc"; 
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    const appId = "visiaura-87251";

    let currentUser = null;
    let localPins = [];
    let isToastEnabled = true;

    window.login = (type) => type === 'google' ? signInWithPopup(auth, provider) : signInAnonymously(auth);
    
    window.logout = () => {
        signOut(auth).then(() => {
            location.reload();
        });
    };

    window.addNewAccount = () => {
        showAuraToast("Membuka Gerbang Sesi Baru...");
        signOut(auth).then(() => {
        });
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            initAura();
            showAuraToast(`Sesi Aktif: ${user.displayName || 'Explorer'}`);
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-section').classList.add('hidden');
            toggleAccount(false); 
        }
    });

    const initAura = () => {
        const pfp = currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.displayName || 'G'}&background=E60023&color=fff`;
        document.getElementById('u-pfp').src = pfp;
        document.getElementById('d-pfp').src = pfp;
        document.getElementById('d-name').innerText = currentUser.displayName || "Aura Explorer";
        document.getElementById('d-mail').innerText = currentUser.email || "Sesi Tamu";
        document.getElementById('aura-id-badge').innerText = `ID: ${currentUser.uid.substring(0, 8)}`;
        
        loadMasonry();
        syncAuraChat();
        applyTheme();
        updateVaultUI();
        lucide.createIcons();
    };

    const loadMasonry = () => {
        const categories = ['Minimalist', 'Streetwear', 'Art', 'Cyber', 'Vintage', 'Indie', 'Fashion', 'Architecture'];
        localPins = [];
        for(let i=0; i<75; i++) {
            const tag = categories[Math.floor(Math.random() * categories.length)];
            localPins.push({ id: i, url: `https://picsum.photos/seed/${i+100}/600/${400 + Math.floor(Math.random()*200)}`, tag });
        }
        renderPins(localPins);
    };

    const renderPins = (data) => {
        const container = document.getElementById('view-home');
        if(data.length === 0) {
            container.innerHTML = `<div class="w-full text-center py-40 text-gray-400 font-bold">Aura tidak ditemukan.</div>`;
            return;
        }
        container.innerHTML = data.map(p => `
            <div class="pin-card group">
                <img src="${p.url}" loading="lazy" class="shimmer">
                <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-all p-6 flex flex-col justify-end">
                    <p class="text-white text-[10px] font-black uppercase tracking-[4px]">${p.tag}</p>
                </div>
            </div>
        `).join('');
    };

    window.handleSearch = (val) => {
        const filtered = localPins.filter(p => p.tag.toLowerCase().includes(val.toLowerCase()));
        renderPins(filtered);
    };

    window.openCamera = () => document.getElementById('camera-capture').click();
    window.triggerUpload = () => document.getElementById('file-upload').click();

    const handleFile = (file) => {
        if(!file) return;
        const url = URL.createObjectURL(file);
        localPins.unshift({ id: Date.now(), url, tag: 'Visual Baru' });
        renderPins(localPins);
        showAuraToast("Visual berhasil diunggah.");
    };

    document.getElementById('file-upload').onchange = (e) => handleFile(e.target.files[0]);
    document.getElementById('camera-capture').onchange = (e) => handleFile(e.target.files[0]);

    window.runGemini = async (type) => {
        if(!geminiKey) return showAuraToast("API Key Error.");
        const isNeo = type === 'neo';
        const input = isNeo ? document.getElementById('neo-prompt').value : `Rekomendasi fashion ${document.getElementById('ootd-style').value} untuk ${document.getElementById('ootd-gen').value}.`;
        const resBox = document.getElementById(isNeo ? 'neo-res' : 'ootd-res');
        const btn = document.getElementById(isNeo ? 'btn-neo' : 'btn-ootd');

        if(isNeo && !input.trim()) return showAuraToast("Isi prompt dulu.");

        btn.innerText = "MENGANALISA...";
        btn.disabled = true;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: input + " (Balas singkat & estetik dalam Bahasa Indonesia)" }] }] })
            });
            const result = await response.json();
            resBox.innerText = result.candidates[0].content.parts[0].text;
            resBox.classList.remove('hidden');
        } catch (e) {
            showAuraToast("AI Gagal merespon.");
        } finally {
            btn.innerText = isNeo ? "PROSES AURA" : "REKOMENDASI GAYA";
            btn.disabled = false;
        }
    };

    window.toggleToastSystem = (el) => isToastEnabled = el.checked;
    
    window.showAuraToast = (msg) => {
        if(!isToastEnabled) return;
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    };

    window.setTheme = (mode) => {
        localStorage.setItem('aura_v_theme', mode);
        applyTheme();
    };

    const applyTheme = () => {
        const mode = localStorage.getItem('aura_v_theme') || 'auto';
        const isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.body.classList.toggle('dark', isDark);
    };

    window.toggleAccount = (force) => {
        const drawer = document.getElementById('acc-drawer');
        const overlay = document.getElementById('acc-overlay');
        if (typeof force === 'boolean') {
            force ? drawer.classList.add('open') : drawer.classList.remove('open');
            force ? overlay.classList.remove('hidden') : overlay.classList.add('hidden');
        } else {
            drawer.classList.toggle('open');
            overlay.classList.toggle('hidden');
        }
    };

    window.changeTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.getElementById(`view-${id}`).classList.remove('hidden');
        const btns = { home:'btn-h', neo:'btn-n', ootd:'btn-o', chat:'btn-c' };
        Object.keys(btns).forEach(key => {
            const btn = document.getElementById(btns[key]);
            btn.classList.toggle('text-[#E60023]', key === id);
            btn.classList.toggle('text-gray-400', key !== id);
        });
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    const syncAuraChat = () => {
        const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), orderBy('time', 'asc'));
        onSnapshot(q, (snap) => {
            const box = document.getElementById('chat-box');
            box.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                const isMe = data.uid === currentUser.uid;
                box.innerHTML += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} animate-fadeIn">
                        <div class="p-4 ${isMe ? 'bg-red-500 text-white rounded-l-3xl rounded-tr-3xl' : 'bg-gray-100 dark:bg-zinc-800 rounded-r-3xl rounded-tl-3xl text-black dark:text-white'} text-xs font-bold shadow-sm max-w-[80%]">
                            <p class="text-[7px] opacity-70 mb-1 uppercase tracking-widest">${data.name}</p>
                            ${data.text}
                        </div>
                    </div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    window.sendMsg = async () => {
        const input = document.getElementById('msg-in');
        if(!input.value.trim()) return;
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
            text: input.value, uid: currentUser.uid, name: currentUser.displayName || "Explorer", time: serverTimestamp()
        });
        input.value = "";
    };

    const updateVaultUI = () => {
        let vault = JSON.parse(localStorage.getItem('aura_vault') || '[]');
        if(!vault.find(u => u.uid === currentUser.uid)) {
            vault.push({
                uid: currentUser.uid, 
                name: currentUser.displayName || 'Explorer', 
                pfp: currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.displayName || 'G'}&background=E60023&color=fff`
            });
            localStorage.setItem('aura_vault', JSON.stringify(vault));
        }
        document.getElementById('vault-list').innerHTML = vault.map(u => `
            <div class="flex items-center justify-between p-4 bg-white dark:bg-zinc-900 rounded-3xl border border-gray-100">
                <div class="flex items-center gap-3">
                    <img src="${u.pfp}" class="w-8 h-8 rounded-full border">
                    <span class="text-[10px] font-black text-black dark:text-white">${u.name}</span>
                </div>
                ${u.uid === currentUser.uid ? '<span class="text-[7px] bg-green-50 text-green-600 px-2 py-1 rounded-md font-black">ACTIVE</span>' : ''}
            </div>
        `).join('');
    };

    lucide.createIcons();
</script>
</body>
</html>
