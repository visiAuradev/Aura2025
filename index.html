<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisiAura Pro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root { --aura-red: #E60023; }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.4s; overflow-x: hidden; }
        body.dark { background: #050505; color: #ffffff; }

        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        body.dark .glass {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .float-card {
            position: absolute;
            width: 130px;
            height: 180px;
            border-radius: 24px;
            background-size: cover;
            background-position: center;
            opacity: 0;
            bottom: -200px;
            animation: floatUp 14s infinite ease-in-out;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-130vh) rotate(20deg); opacity: 0; }
        }

        .masonry { column-count: 2; column-gap: 16px; }
        @media (min-width: 768px) { .masonry { column-count: 3; } }
        @media (min-width: 1024px) { .masonry { column-count: 5; } }

        .pin-card { 
            break-inside: avoid; 
            margin-bottom: 16px; 
            border-radius: 28px; 
            overflow: hidden; 
            position: relative; 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: zoom-in;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .pin-card:hover { transform: scale(1.03); }

        .loader-neon {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top: 3px solid var(--aura-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            filter: drop-shadow(0 0 10px var(--aura-red));
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #acc-drawer { 
            transform: translateY(105%); 
            transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1); 
            box-shadow: 0 -25px 80px rgba(0,0,0,0.2);
        }
        #acc-drawer.open { transform: translateY(0); }

        #toast { transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #toast.show { transform: translateX(0); }
    </style>
</head>
<body class="bg-white">

<div id="app-root">
    <input type="file" id="upload-input" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
    <input type="file" id="camera-input" accept="image/*" capture="user" class="hidden" onchange="handleFileUpload(event)">

    <div id="toast" class="fixed top-6 right-6 glass p-5 rounded-[30px] shadow-2xl z-[9999] flex items-center gap-4 border border-white/40">
        <div class="w-12 h-12 bg-red-100 rounded-2xl flex items-center justify-center text-red-600">
            <i data-lucide="sparkles"></i>
        </div>
        <div>
            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">VisiAura Status</p>
            <p id="toast-msg" class="text-sm font-bold text-black dark:text-white">Proses Berhasil</p>
        </div>
    </div>

    <section id="auth-section" class="fixed inset-0 bg-white z-[5000] overflow-hidden">
        <div id="floating-bg" class="absolute inset-0 pointer-events-none"></div>
        <div class="relative z-10 flex items-center justify-center h-full p-6">
            <div class="w-full max-w-md glass p-12 rounded-[60px] text-center shadow-2xl">
                <div class="w-20 h-20 bg-[#E60023] rounded-[35%] mx-auto mb-8 flex items-center justify-center text-white shadow-xl animate-pulse text-2xl font-black">V</div>
                <h1 class="text-5xl font-extrabold tracking-tighter mb-4 italic">VisiAura<span class="text-[#E60023]">.</span></h1>
                <p class="text-gray-400 font-medium mb-12 text-sm leading-relaxed px-4">Eksplorasi visual cerdas dengan integrasi kecerdasan AI</p>
                <div class="space-y-4">
                    <button onclick="login('google')" class="w-full py-4 rounded-2xl border border-gray-100 font-bold flex items-center justify-center gap-4 hover:bg-gray-50 transition-all text-sm text-black bg-white">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> Lanjutkan dengan Google
                    </button>
                    <button onclick="login('guest')" class="w-full bg-black text-white py-4 rounded-2xl font-bold shadow-xl text-sm transition-transform active:scale-95">Login(Guest)</button>
                </div>
            </div>
        </div>
    </section>

    <section id="main-section" class="hidden min-h-screen">
        <header class="fixed top-0 inset-x-0 glass z-[200] px-4 md:px-10 py-5 flex items-center gap-4">
            <div class="text-[#E60023] font-black text-3xl italic">V</div>
            <div class="flex-1 relative flex items-center">
                <i data-lucide="search" class="absolute left-6 text-gray-400 w-4 h-4"></i>
                <input type="text" id="main-search" oninput="handleSearch(this.value)" placeholder="Cari inspirasi visual..." class="w-full bg-gray-100 focus:bg-white focus:ring-4 focus:ring-red-50 rounded-full py-4 pl-14 pr-16 border-none transition-all text-sm outline-none text-black">
                <button onclick="openCamera()" class="absolute right-4 w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-500 hover:text-red-600 shadow-sm active:scale-90 transition-all">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                </button>
            </div>
            <button onclick="toggleAccount(true)" class="w-12 h-12 rounded-2xl bg-gray-100 overflow-hidden border-2 border-white shadow-md relative shrink-0">
                <img id="u-pfp" src="" class="w-full h-full object-cover">
            </button>
        </header>

        <main class="pt-32 pb-32 px-4 md:px-10 max-w-[1700px] mx-auto">
            <div id="view-home" class="tab-content masonry"></div>

            <div id="view-neo" class="tab-content hidden max-w-2xl mx-auto py-10">
                <div class="glass p-8 md:p-12 rounded-[50px] shadow-2xl border border-white/50">
                    <div class="flex items-center gap-5 mb-10">
                        <div class="w-16 h-16 bg-gradient-to-br from-red-500 to-orange-500 rounded-3xl flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="sparkles" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-3xl font-black tracking-tighter text-black dark:text-white">Aura AI Studio</h2>
                    </div>

                    <div class="space-y-6">
                        <textarea id="neo-prompt" rows="4" class="w-full bg-gray-50 dark:bg-zinc-800 rounded-[30px] p-7 border-none text-sm outline-none focus:ring-4 focus:ring-red-50 transition-all text-black dark:text-white" placeholder="Deskripsikan gambar yang ingin Anda buat..."></textarea>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <select id="ai-model" class="w-full bg-gray-50 dark:bg-zinc-800 p-5 rounded-2xl border-none font-bold text-xs outline-none text-black dark:text-white">
                                <option value="gemini">Google Gemini 2.5</option>
                                <option value="openai">OpenAI (Coming Soon)</option>
                            </select>
                            <button onclick="openCamera()" class="w-full bg-gray-100 dark:bg-zinc-800 p-5 rounded-2xl flex items-center justify-center gap-3 font-bold text-xs text-black dark:text-white">
                                <i data-lucide="camera" class="w-4 h-4 text-red-500"></i> GUNAKAN FOTO
                            </button>
                        </div>

                        <button id="btn-generate" onclick="generateVisual()" class="w-full bg-black text-white py-6 rounded-[30px] font-black text-sm tracking-widest shadow-2xl hover:bg-[#E60023] transition-all transform active:scale-95">
                            BUAT VISUAL
                        </button>
                    </div>
                </div>

                <div id="neo-loader" class="hidden fixed inset-0 z-[1000] bg-black/70 backdrop-blur-2xl flex flex-col items-center justify-center text-white">
                    <div class="loader-neon mb-8"></div>
                    <p class="text-[10px] font-black uppercase tracking-[10px] animate-pulse">Memproses Aura AI...</p>
                </div>

                <div id="neo-res-container" class="mt-12 hidden">
                    <div id="neo-media" class="rounded-[40px] overflow-hidden shadow-2xl border-8 border-white dark:border-zinc-800"></div>
                </div>
            </div>

            <div id="view-chat" class="tab-content hidden max-w-4xl mx-auto h-[70vh] flex flex-col glass rounded-[50px] shadow-2xl overflow-hidden">
                <div id="chat-box" class="flex-1 overflow-y-auto p-8 space-y-6 text-black"></div>
                <div class="p-6 bg-white/40 border-t flex gap-3">
                    <button onclick="document.getElementById('upload-input').click()" class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-500 hover:text-red-500 transition-all shrink-0">
                        <i data-lucide="image"></i>
                    </button>
                    <input id="msg-in" type="text" placeholder="Tulis pesan..." class="flex-1 bg-gray-100 rounded-2xl px-6 py-4 border-none text-sm outline-none text-black">
                    <button onclick="sendMsg()" class="bg-[#E60023] text-white px-6 rounded-2xl shadow-xl font-bold shrink-0">KIRIM</button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 glass shadow-2xl rounded-full px-8 py-4 flex items-center gap-10 z-[400] border border-white/50">
            <button onclick="changeTab('home')" id="btn-h" class="text-[#E60023] transition-all"><i data-lucide="home"></i></button>
            <button onclick="changeTab('neo')" id="btn-n" class="text-gray-400 hover:text-black transition-all"><i data-lucide="sparkles"></i></button>
            <button onclick="document.getElementById('upload-input').click()" class="w-16 h-16 bg-black text-white rounded-2xl flex items-center justify-center shadow-2xl active:scale-90 transform -translate-y-4 hover:bg-[#E60023] transition-all">
                <i data-lucide="plus" class="w-8 h-8"></i>
            </button>
            <button onclick="changeTab('chat')" id="btn-c" class="text-gray-400 hover:text-black transition-all"><i data-lucide="message-square"></i></button>
            <button onclick="toggleAccount(true)" class="text-gray-400 hover:text-black transition-all"><i data-lucide="settings"></i></button>
        </nav>
    </section>

    <div id="acc-overlay" onclick="toggleAccount(false)" class="fixed inset-0 bg-black/60 z-[1000] hidden backdrop-blur-md"></div>
    <div id="acc-drawer" class="fixed bottom-0 left-0 right-0 glass z-[1001] rounded-t-[60px] p-10 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <button onclick="toggleAccount(false)" class="flex items-center gap-2 text-[10px] font-black text-gray-400">
                <i data-lucide="chevron-down" class="w-4 h-4"></i> TUTUP
            </button>
            <div class="w-16 h-1.5 bg-gray-200 rounded-full"></div>
            <div class="w-10"></div>
        </div>
        
        <div class="flex flex-col items-center mb-12">
            <div class="relative mb-4">
                <img id="d-pfp" src="" class="w-32 h-32 rounded-[40%] border-4 border-white shadow-xl object-cover">
                <button onclick="openCamera()" class="absolute bottom-0 right-0 w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center text-red-500">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                </button>
            </div>
            <h3 id="d-name" class="text-3xl font-black text-black dark:text-white">User Aura</h3>
            <p id="d-mail" class="text-gray-400 text-sm"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-8 bg-gray-50/50 dark:bg-zinc-900/50 rounded-[40px]">
                <h4 class="text-[10px] font-black uppercase text-gray-400 mb-6 tracking-widest">Sesi Akun</h4>
                <div id="session-list" class="space-y-3"></div>
                <button onclick="addNewSession()" class="mt-6 w-full py-4 border-2 border-dashed border-gray-200 rounded-2xl text-[10px] font-black text-gray-400 hover:text-red-500 hover:border-red-200 transition-all">+ TAMBAH AKUN LAIN</button>
            </div>

            <div class="p-8 bg-gray-50/50 dark:bg-zinc-900/50 rounded-[40px] space-y-4">
                <h4 class="text-[10px] font-black uppercase text-gray-400 mb-6 tracking-widest">Pengaturan Cepat</h4>
                <div class="flex gap-4">
                    <button onclick="setTheme('light')" class="flex-1 p-4 bg-white rounded-2xl flex flex-col items-center gap-2 border">
                        <i data-lucide="sun" class="text-orange-400"></i> <span class="text-[9px] font-black">TERANG</span>
                    </button>
                    <button onclick="setTheme('dark')" class="flex-1 p-4 bg-zinc-800 rounded-2xl flex flex-col items-center gap-2 text-white">
                        <i data-lucide="moon" class="text-indigo-400"></i> <span class="text-[9px] font-black">GELAP</span>
                    </button>
                </div>
                <button onclick="logout()" class="w-full py-4 bg-red-50 text-red-600 rounded-2xl text-[10px] font-black">KELUAR DARI SEMUA SESI</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const GEMINI_API_KEY = "AIzaSyC-EORQ7dTIY8De27SnP6PZ04tPfdmqn_4"; 
    const OPENAI_API_KEY = "AIzaSyC5WrwvwN13jUfZ7EdtuurMA3rUQ1WtrPQ"; 

    const firebaseConfig = {
        apiKey: "AIzaSyCClWupRb5ETPWm-tQ_-x4U9K0dZ5CjPKQ",
        authDomain: "visiaura-87251.firebaseapp.com",
        projectId: "visiaura-87251",
        storageBucket: "visiaura-87251.firebasestorage.app",
        messagingSenderId: "999783403118",
        appId: "1:999783403118:web:436dd872d599e7f5eaa07f"
    };
    
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'visiaura-87251';
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let localPins = [];

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            saveSession(user);
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            setupApp();
            showAuraToast(`Halo, ${user.displayName || 'User'}!`);
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-section').classList.add('hidden');
        }
    });

    window.login = (type) => type === 'google' ? signInWithPopup(auth, provider) : signInAnonymously(auth);
    window.logout = () => signOut(auth).then(() => { localStorage.clear(); location.reload(); });

    const saveSession = (user) => {
        let sessions = JSON.parse(localStorage.getItem('aura_sessions') || '[]');
        if(!sessions.find(s => s.uid === user.uid)) {
            sessions.push({ uid: user.uid, name: user.displayName || 'Tamu', pfp: user.photoURL });
            localStorage.setItem('aura_sessions', JSON.stringify(sessions));
        }
    };

    window.addNewSession = () => signOut(auth).then(() => toggleAccount(false));

    window.openCamera = () => document.getElementById('camera-input').click();

    window.handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        showAuraToast("Memproses Media...");
        const reader = new FileReader();
        reader.onload = (e) => {
            const newPin = { id: Date.now(), url: e.target.result, tag: "Unggahan" };
            localPins.unshift(newPin);
            renderPins(localPins);
            changeTab('home');
            showAuraToast("Berhasil ditambahkan ke galeri!");
        };
        reader.readAsDataURL(file);
    };

    window.generateVisual = async () => {
        const prompt = document.getElementById('neo-prompt').value;
        const modelType = document.getElementById('ai-model').value;
        
        if(!prompt) return showAuraToast("Tulis deskripsi gambarnya dulu ya!");
        if(modelType === 'gemini' && !GEMINI_API_KEY) return showAuraToast("Gagal mengambil");

        const loader = document.getElementById('neo-loader');
        loader.classList.remove('hidden');

        try {
            let resultUrl = "";
            
            if(modelType === 'gemini') {
                await new Promise(r => setTimeout(r, 2000));
                resultUrl = `https://picsum.photos/seed/${encodeURIComponent(prompt)}/800/1200`;
            }

            document.getElementById('neo-media').innerHTML = `<img src="${resultUrl}" class="w-full">`;
            document.getElementById('neo-res-container').classList.remove('hidden');
            
            localPins.unshift({ id: Date.now(), url: resultUrl, tag: "AI " + prompt.substring(0, 10) });
            renderPins(localPins);
            showAuraToast("Aura AI berhasil menciptakan visual!");
        } catch (err) {
            showAuraToast("Gagal memanggil AI. Cek koneksi/API Key.");
        } finally {
            loader.classList.add('hidden');
        }
    };

    const setupApp = () => {
        const pfp = currentUser.photoURL || `https://ui-avatars.com/api/?name=${currentUser.displayName || 'U'}&background=E60023&color=fff`;
        document.getElementById('u-pfp').src = pfp;
        document.getElementById('d-pfp').src = pfp;
        document.getElementById('d-name').innerText = currentUser.displayName || "User Aura";
        document.getElementById('d-mail').innerText = currentUser.email || "User Aura";
        
        loadMasonry();
        syncChat();
        updateSessionUI();
        lucide.createIcons();
    };

    const loadMasonry = () => {
        const defaultPins = Array.from({length: 100}, (_, i) => ({
            id: i,
            url: `https://picsum.photos/seed/${i + 300}/800/${Math.floor(Math.random() * 400) + 400}`,
            tag: ["Art", "Vibe", "Future"][i % 3]
        }));
        localPins = [...defaultPins];
        renderPins(localPins);
    };

    const renderPins = (data) => {
        const container = document.getElementById('view-home');
        container.innerHTML = data.map(p => `
            <div class="pin-card group">
                <img src="${p.url}" class="w-full bg-gray-100 min-h-[150px]">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-all flex items-end p-4">
                    <span class="text-[9px] font-black text-white uppercase bg-white/20 backdrop-blur-md px-3 py-1 rounded-full">${p.tag}</span>
                </div>
            </div>
        `).join('');
    };

    window.handleSearch = (val) => {
        const filtered = localPins.filter(p => p.tag.toLowerCase().includes(val.toLowerCase()));
        renderPins(filtered);
    };

    const syncChat = () => {
        const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), orderBy('time', 'asc'));
        onSnapshot(q, (snap) => {
            const box = document.getElementById('chat-box');
            box.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                const isMe = d.uid === currentUser.uid;
                box.innerHTML += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                        <div class="px-5 py-3 ${isMe ? 'bg-black text-white rounded-[20px] rounded-br-none' : 'bg-gray-100 text-black rounded-[20px] rounded-bl-none'} text-sm font-medium max-w-[80%]">
                            ${d.text}
                        </div>
                    </div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    window.sendMsg = async () => {
        const input = document.getElementById('msg-in');
        if(!input.value.trim()) return;
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
            text: input.value, uid: currentUser.uid, time: serverTimestamp()
        });
        input.value = "";
    };

    window.showAuraToast = (msg) => {
        const t = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    };

    window.changeTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(`view-${id}`).classList.remove('hidden');
        
        ['h', 'n', 'c'].forEach(k => {
            const btn = document.getElementById(`btn-${k}`);
            if(btn) btn.classList.replace('text-[#E60023]', 'text-gray-400');
        });
        const activeBtn = document.getElementById(`btn-${id === 'home' ? 'h' : (id === 'neo' ? 'n' : 'c')}`);
        if(activeBtn) activeBtn.classList.replace('text-gray-400', 'text-[#E60023]');
        
        lucide.createIcons();
    };

    window.toggleAccount = (s) => {
        document.getElementById('acc-drawer').classList.toggle('open', s);
        document.getElementById('acc-overlay').classList.toggle('hidden', !s);
    };

    const updateSessionUI = () => {
        const sessions = JSON.parse(localStorage.getItem('aura_sessions') || '[]');
        document.getElementById('session-list').innerHTML = sessions.map(s => `
            <div class="p-4 bg-white dark:bg-zinc-800 rounded-2xl flex items-center gap-3 border ${s.uid === currentUser.uid ? 'border-red-500' : 'border-transparent'}">
                <img src="${s.pfp || 'https://ui-avatars.com/api/?name=' + s.name}" class="w-8 h-8 rounded-full">
                <span class="text-[10px] font-bold">${s.name} ${s.uid === currentUser.uid ? '(Aktif)' : ''}</span>
            </div>
        `).join('');
    };

    window.setTheme = (t) => document.body.classList.toggle('dark', t === 'dark');

    const bg = document.getElementById('floating-bg');
    for(let i=0; i<60; i++) {
        const card = document.createElement('div');
        card.className = 'float-card';
        card.style.left = `${Math.random() * 90}%`;
        card.style.backgroundImage = `url(https://picsum.photos/seed/${i+200}/200/300)`;
        card.style.animationDelay = `${Math.random() * 10}s`;
        bg.appendChild(card);
    }

    lucide.createIcons();
</script>
</body>
</html>
